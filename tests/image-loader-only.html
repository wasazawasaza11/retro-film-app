<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>画像読込経路の比較</title><style>body{background:#181818;color:#eee;font:14px system-ui;margin:16px}label,select{padding:10px;background:#333;color:white}canvas{display:block;max-width:100%;max-height:55vh;margin-top:20px}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{display:block;margin:15px 0}</style></head><body><h1>画像読込だけの比較</h1><small>加工・ジェスチャー・Fit wrapper・Service Worker登録を使わない切り分け用ページ。画像を送信・保存しません。</small><select id="route"><option value="current">現在のimage-loader.js</option><option value="legacy">大改修直前のImage.decode経路</option></select><label for="photo">写真を選ぶ</label><input id="photo" type="file" accept="image/*" hidden><canvas id="preview"></canvas><pre id="log">idle</pre><script type="module">
import {loadImage,createSeed} from '../js/image-loader.js';
const log=document.getElementById('log'),canvas=document.getElementById('preview');let retained=null;
const write=text=>{log.textContent+='\n'+text;};
const debug={step:write,info:write,error:(name,error)=>write(`ERROR: ${name}\n${error.message}`)};
// Reconstructed from this chat's exact pre-refactor source, not a new loader.
async function legacyLoad(file){const url=URL.createObjectURL(file),image=new Image();try{image.src=url;write('Image.decode start');await image.decode();write('Image.decode success');if(!image.naturalWidth||!image.naturalHeight)throw Error('画像サイズを読み取れませんでした。');return {source:image,width:image.naturalWidth,height:image.naturalHeight,seed:createSeed(),release:()=>{image.src='';URL.revokeObjectURL(url);}};}catch(error){URL.revokeObjectURL(url);throw error;}}
document.getElementById('photo').addEventListener('change',async event=>{log.textContent='input change';const file=event.target.files?.[0];if(!file){write('ERROR: file received\n0 files');return;}write(`name: ${file.name}\ntype: ${file.type}\nsize: ${file.size}`);event.target.value='';try{const image=await(document.getElementById('route').value==='legacy'?legacyLoad(file):loadImage(file,debug));const scale=Math.min(1,800/Math.max(image.width,image.height));canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));write(`native: ${image.width}x${image.height}; canvas: ${canvas.width}x${canvas.height}`);write('drawImage start');canvas.getContext('2d').drawImage(image.source,0,0,canvas.width,canvas.height);write('drawImage success');retained?.release();retained=image;write('render complete');}catch(error){write(`ERROR: loader / drawImage\n${error.message}`);}});
</script></body></html>
